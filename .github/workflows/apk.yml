# Altın Halı Android oyununun APK'sını derler.
# Actions → bu çalıştırma → Artifacts → "altin-hali-apk" ile indirip telefona kurabilirsiniz.
name: Altın Halı APK

on:
  push:
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK derle
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: altin-hali-apk
          path: app/build/outputs/apk/debug/app-debug.apk
